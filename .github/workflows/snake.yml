name: Contribution snake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6250d6&color_dots=#ebedf0,#cde2fb,#86b6ef,#3987e5,#1c5cab
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#9085e9&color_dots=#161b22,#104281,#1c5cab,#3987e5,#86b6ef

      - name: Publish the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
