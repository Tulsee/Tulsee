<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Shankar Ghimire: reliable deep learning under uncertainty</title>
<desc id="desc">Banner with the name Shankar Ghimire, rotating research themes, and an illustration of selective prediction: a model answers only while its risk stays below a target level and defers beyond it.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fc"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#6250d6"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.82" cy="0.10" r="0.55">
    <stop offset="0" stop-color="#2a78d6" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="rgba(11,11,11,0.06)"/>
  </pattern>
  <clipPath id="card"><rect width="1200" height="380" rx="20"/></clipPath>
</defs>
<style>
  .kicker { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #898781; }
  .name { font: 700 66px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1px; fill: #0b0b0b; }
  .tag { font: 400 28px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #52514e; }
  .t2, .t3 { opacity: 0; }
  .chiptext { font: 500 15px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #52514e; }
  .ptitle { font: 600 18px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0b0b0b; }
  .psub { font: 500 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #898781; }
  .lbl { font: 500 14px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #898781; }
  .lbl2 { font: 600 14px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #52514e; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes pulse { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(3.2); opacity: 0; } }
  @keyframes cycle {
    0% { opacity: 0; transform: translateY(10px); }
    5% { opacity: 1; transform: none; }
    29% { opacity: 1; transform: none; }
    34% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 0; transform: translateY(-10px); }
  }

  .kicker { animation: rise .7s ease-out .1s both; }
  .name { animation: rise .8s ease-out .25s both; }
  .bar { transform-box: fill-box; transform-origin: left center; animation: grow .8s cubic-bezier(.2,.8,.2,1) .7s both; }
  .tag { animation: cycle 10.5s ease-in-out infinite both; }
  .t1 { animation-delay: 1s; }
  .t2 { animation-delay: 4.5s; }
  .t3 { animation-delay: 8s; }
  .chip { animation: rise .6s ease-out both; }
  .panel { animation: fade .8s ease-out .6s both; }
  .curve { stroke-dasharray: 1; animation: draw 2.2s cubic-bezier(.4,0,.2,1) 1.1s both; }
  .alpha { animation: fade .6s ease-out 2.5s both; }
  .wash { animation: fade .9s ease-out 3.1s both; }
  .marker { transform-box: fill-box; transform-origin: center; animation: pop .5s ease-out 3.0s both; }
  .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse 2.4s ease-out 3.6s infinite; }
  .zone { animation: fade .8s ease-out 3.3s both; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .ring { display: none; }
  }
</style>

<g clip-path="url(#card)">
  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#dots)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="379" rx="19.5" fill="none" stroke="rgba(11,11,11,0.10)"/>

<text x="64" y="96" class="kicker">SOFTWARE ENGINEER · MSc CANDIDATE · KATHMANDU</text>
<text x="62" y="172" class="name">Shankar Ghimire</text>
<rect x="64" y="192" width="136" height="4" rx="2" fill="url(#accent)" class="bar"/>
<text x="64" y="244" class="tag t1">Reliable deep learning under uncertainty</text><text x="64" y="244" class="tag t2">Multimodal fusion when inputs go missing</text><text x="64" y="244" class="tag t3">Retrieval that knows when not to answer</text>
<g class="chip" style="animation-delay:1.15s"><rect x="64.0" y="276" width="198.0" height="32" rx="16" fill="rgba(11,11,11,0.025)" stroke="rgba(11,11,11,0.10)"/><text x="163.0" y="297" text-anchor="middle" class="chiptext">Selective prediction</text></g><g class="chip" style="animation-delay:1.27s"><rect x="272.0" y="276" width="122.4" height="32" rx="16" fill="rgba(11,11,11,0.025)" stroke="rgba(11,11,11,0.10)"/><text x="333.2" y="297" text-anchor="middle" class="chiptext">Calibration</text></g><g class="chip" style="animation-delay:1.39s"><rect x="404.4" y="276" width="172.8" height="32" rx="16" fill="rgba(11,11,11,0.025)" stroke="rgba(11,11,11,0.10)"/><text x="490.8" y="297" text-anchor="middle" class="chiptext">Multimodal fusion</text></g><g class="chip" style="animation-delay:1.51s"><rect x="587.2" y="276" width="147.6" height="32" rx="16" fill="rgba(11,11,11,0.025)" stroke="rgba(11,11,11,0.10)"/><text x="661.0" y="297" text-anchor="middle" class="chiptext">RAG evaluation</text></g>

<g class="panel" transform="translate(756,52)">
  <rect width="380" height="276" rx="14" fill="#ffffff" stroke="rgba(11,11,11,0.08)"/>
  <text x="24" y="36" class="ptitle">Answer only while risk ≤ α</text>
  <text x="24" y="58" class="psub">selective prediction · illustrative</text>

  <line x1="44" y1="214" x2="352" y2="214" stroke="#c3c2b7" stroke-width="1"/>
  <line x1="44" y1="92" x2="44" y2="214" stroke="#c3c2b7" stroke-width="1"/>
  <text x="44" y="84" class="lbl">risk</text>
  <text x="352" y="266" class="lbl" text-anchor="end">coverage →</text>

  <path class="wash" d="M44,214 L44.0,209.4 L46.8,209.4 L49.6,209.4 L52.4,209.4 L55.2,209.3 L58.0,209.3 L60.8,209.3 L63.7,209.3 L66.5,209.2 L69.3,209.2 L72.1,209.1 L74.9,209.1 L77.7,209.0 L80.5,208.9 L83.3,208.8 L86.1,208.7 L88.9,208.6 L91.7,208.5 L94.5,208.3 L97.4,208.2 L100.2,208.0 L103.0,207.8 L105.8,207.7 L108.6,207.4 L111.4,207.2 L114.2,207.0 L117.0,206.7 L119.8,206.5 L122.6,206.2 L125.4,205.9 L128.2,205.5 L131.0,205.2 L133.9,204.8 L136.7,204.5 L139.5,204.1 L142.3,203.6 L145.1,203.2 L147.9,202.8 L150.7,202.3 L153.5,201.8 L156.3,201.3 L159.1,200.7 L161.9,200.2 L164.7,199.6 L167.5,199.0 L170.4,198.4 L173.2,197.7 L176.0,197.1 L178.8,196.4 L181.6,195.7 L184.4,194.9 L187.2,194.2 L190.0,193.4 L192.8,192.6 L195.6,191.7 L198.4,190.9 L201.2,190.0 L204.1,189.1 L206.9,188.1 L209.7,187.2 L212.5,186.2 L212.5,214 Z" fill="#2a78d6" fill-opacity="0.10"/>
  <g class="alpha">
    <line x1="44" y1="186.2" x2="352" y2="186.2" stroke="#898781" stroke-width="1"/>
    <text x="352" y="178.2" class="lbl" text-anchor="end">target risk α</text>
    <line x1="212.5" y1="186.2" x2="212.5" y2="246" stroke="#898781" stroke-width="1"/>
  </g>
  <path class="curve" d="M44.0,209.4 L49.1,209.4 L54.3,209.3 L59.4,209.3 L64.5,209.3 L69.7,209.2 L74.8,209.1 L79.9,208.9 L85.1,208.8 L90.2,208.6 L95.3,208.3 L100.5,208.0 L105.6,207.7 L110.7,207.3 L115.9,206.8 L121.0,206.3 L126.1,205.8 L131.3,205.2 L136.4,204.5 L141.5,203.8 L146.7,203.0 L151.8,202.1 L156.9,201.2 L162.1,200.2 L167.2,199.1 L172.3,197.9 L177.5,196.7 L182.6,195.4 L187.7,194.0 L192.9,192.5 L198.0,191.0 L203.1,189.4 L208.3,187.6 L213.4,185.8 L218.5,183.9 L223.7,181.9 L228.8,179.9 L233.9,177.7 L239.1,175.4 L244.2,173.0 L249.3,170.6 L254.5,168.0 L259.6,165.3 L264.7,162.5 L269.9,159.6 L275.0,156.7 L280.1,153.6 L285.3,150.3 L290.4,147.0 L295.5,143.6 L300.7,140.0 L305.8,136.4 L310.9,132.6 L316.1,128.7 L321.2,124.7 L326.3,120.5 L331.5,116.3 L336.6,111.9 L341.7,107.4 L346.9,102.8 L352.0,98.0" pathLength="1" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="zone">
    <text x="128.2" y="240" class="lbl2" text-anchor="middle">answer</text>
    <text x="282.2" y="240" class="lbl" text-anchor="middle">defer to a person</text>
  </g>
  <circle class="ring" cx="212.5" cy="186.2" r="5" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
  <circle class="marker" cx="212.5" cy="186.2" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
</g>
</svg>
